<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </radialGradient>

    <!-- Brain Yellow / Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#FACC15"/>
      <stop offset="75%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <!-- Glowing Aura -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Slate Squircle Base for High Tab Visibility -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGlow)"/>
  <rect x="24" y="24" width="464" height="464" rx="120" fill="none" stroke="#EAB308" stroke-width="8" stroke-opacity="0.3"/>

  <!-- Subtle Radial Glow behind Brain -->
  <circle cx="256" cy="256" r="160" fill="#EAB308" fill-opacity="0.18" filter="url(#glow)"/>

  <!-- Yellow Brain Vector Graphic -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Hemisphere Outer Profile -->
    <path d="M 236 120 C 180 120, 120 160, 120 220 C 120 248, 134 274, 146 292 C 128 316, 136 352, 160 376 C 180 396, 214 402, 236 394" />
    
    <!-- Left Hemisphere Convolutions -->
    <path d="M 190 170 C 220 180, 236 210, 216 238 C 196 266, 150 260, 160 295 C 168 320, 196 330, 236 320" stroke-width="20" />
    <path d="M 236 170 C 185 185, 160 215, 175 240" stroke-width="18" />
    <path d="M 236 260 C 210 260, 190 280, 205 305 C 218 328, 236 350, 236 360" stroke-width="18" />

    <!-- Right Hemisphere Outer Profile -->
    <path d="M 276 120 C 332 120, 392 160, 392 220 C 392 248, 378 274, 366 292 C 384 316, 376 352, 352 376 C 332 396, 298 402, 276 394" />
    
    <!-- Right Hemisphere Convolutions -->
    <path d="M 322 170 C 292 180, 276 210, 296 238 C 316 266, 362 260, 352 295 C 344 320, 316 330, 276 320" stroke-width="20" />
    <path d="M 276 170 C 327 185, 352 215, 337 240" stroke-width="18" />
    <path d="M 276 260 C 302 260, 322 280, 307 305 C 294 328, 276 350, 276 360" stroke-width="18" />

    <!-- Center Corpus Callosum Fissure Divide -->
    <line x1="256" y1="128" x2="256" y2="390" stroke="#FDE047" stroke-width="14" stroke-dasharray="16 12"/>
  </g>

  <!-- Sparkle Accent Points -->
  <circle cx="160" cy="160" r="8" fill="#FEF08A" />
  <circle cx="352" cy="160" r="8" fill="#FEF08A" />
  <circle cx="256" cy="100" r="10" fill="#FEF08A" />
</svg>
